[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tickerflow"
version = "0.2.0"
description = "One async Python call for crypto, stocks, and forex OHLCV data — automatic provider routing, zero API keys"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "FaustoS88" }]
keywords = [
    "ohlcv", "market-data", "trading", "finance",
    "binance", "yfinance", "tiingo", "finnhub",
    "ccxt-alternative", "yfinance-alternative",
    "stock-data", "forex-data", "crypto-data",
    "no-api-key", "async-python", "pydantic-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Framework :: FastAPI",
]
dependencies = [
    "aiohttp>=3.9",
    "yfinance>=0.2",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
tiingo = ["requests>=2.31"]
finnhub = ["finnhub-python>=2.4"]
pandas = ["pandas>=2.0"]
chart = ["plotext>=5.2"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
ai = ["pydantic-ai>=2.0.0"]
all = [
    "tickerflow[tiingo,finnhub,pandas,chart,serve,ai]",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "aioresponses>=0.7",
    "build>=1.0",
    "pandas>=2.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "plotext>=5.2",
]

[project.scripts]
tickerflow = "tickerflow.cli:main"

[project.urls]
Repository = "https://github.com/FaustoS88/tickerflow"
Documentation = "https://github.com/FaustoS88/tickerflow#readme"
Changelog = "https://github.com/FaustoS88/tickerflow/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
"tickerflow" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
