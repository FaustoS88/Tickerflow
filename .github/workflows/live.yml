name: Live

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/test_live.py"
      - ".github/workflows/live.yml"

jobs:
  live:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Real requests to the keyless providers
        run: pytest tests/test_live.py -v -rs
        env:
          TICKERFLOW_LIVE: "1"
